[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"

authors = [
    { name = "Nayeon Kim", email = "lkim0731@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "llama-cloud>=1.0",
    "milvus-lite>=3.0",
    "openai>=3.49.0",
    "pymilvus[milvus-lite]>=3.0.3",
    "pymupdf>=2.1",
    "python-multipart>=0.0.34",
    "sentence-transformers>=6.2.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
