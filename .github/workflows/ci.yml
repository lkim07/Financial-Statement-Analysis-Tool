# PR과 main 푸시마다 평가셋 형식과 순수 함수 테스트를 돌린다.
# 모델(torch)이나 원본 PDF가 필요 없는 검사만 한다 (decision 006: PDF는 리포에 없다).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 가벼운 패키지만: 구조화 출력 스키마(pydantic), API 테스트(fastapi, httpx), 하이라이트 좌표(pymupdf).
      # 임베딩 모델(torch), Milvus, OpenAI 호출은 여전히 CI에서 돌리지 않는다 (decision 018, 031).
      - name: Install test tools
        run: pip install pytest pydantic fastapi httpx pymupdf

      - name: Validate golden set (structure only, no PDF)
        run: python evals/validate.py evals/golden.jsonl

      - name: Unit tests
        run: pytest -q tests